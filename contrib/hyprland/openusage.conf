# Hyprland before 0.55 (hyprlang config); for the Lua config use openusage.lua.
# Float the terminal used for sign-in.
# The window title has to be exactly "openusage", for example:
#   xdg-terminal-exec --title=openusage openusage add claude
windowrule = match:title ^(openusage)$, float on, center on, size 720 480
