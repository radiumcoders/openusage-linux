# Float the terminal used for sign-in and for `openusage accounts`.
# The window title has to be exactly "openusage", for example:
#   kitty --title openusage -e openusage add claude
# The Waybar snippet sets that title when it opens kitty or $TERMINAL.
windowrule = match:title ^(openusage)$, float on, center on, size 720 480
