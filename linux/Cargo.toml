[workspace]
resolver = "2"
members = ["crates/openusage-core", "crates/openusage-cli", "crates/openusage-panel"]

[workspace.package]
version = "0.8.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
openusage-core = { path = "crates/openusage-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
ureq = { version = "2", features = ["json", "socks-proxy"] }
plist = "1"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
libc = "0.2"
regex = "1"
gtk4 = { version = "0.10", features = ["v4_12"] }
gtk4-layer-shell = "0.6"

[profile.release]
lto = "thin"
strip = true
